# Alembic configuration for Make Again backend.
# The database URL is overwritten at runtime in alembic/env.py from config.get_settings()
# (i.e. the same DATABASE_URL the application engine uses), so the value below is only
# a placeholder for CLI usage when no DATABASE_URL is exported.
[alembic]
script_location = %(here)s/alembic
path_separator = os
prepend_sys_path = .
sqlalchemy.url = sqlite:///./data/app.db

# Logging configuration (kept minimal; Alembic CLI works without it too).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
