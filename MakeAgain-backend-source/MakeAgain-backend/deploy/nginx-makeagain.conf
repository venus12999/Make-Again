# Nginx config for makeagain.edsionc.top
# Copy to /etc/nginx/conf.d/10-makeagain-edsionc-top.conf

server {
    listen 80;
    server_name makeagain.edsionc.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name makeagain.edsionc.top;

    # SSL (use certbot to generate: certbot certonly --nginx -d makeagain.edsionc.top)
    ssl_certificate /etc/letsencrypt/live/makeagain.edsionc.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/makeagain.edsionc.top/privkey.pem;

    # Proxy to Docker container
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Health check
    location /api/health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }
}