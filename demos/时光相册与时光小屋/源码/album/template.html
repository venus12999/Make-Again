<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Make Again · 时光相册</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+SC:wght@500;600&family=Special+Elite&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--hand:"Long Cang","Kaiti SC","STKaiti",KaiTi,serif;--serif:"Cormorant Garamond",Georgia,serif;--song:"Noto Serif SC","Songti SC",serif}
html,body{margin:0;height:100%;background:#D9D2DF;font-family:-apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:min(100vw,430px);height:min(100vh,900px);overflow:hidden;background:#F6F0E8;color:#4A3D38;user-select:none;-webkit-user-select:none}
@media (min-width:500px){#app{border-radius:40px;box-shadow:0 40px 100px rgba(50,30,70,.3)}}
#app::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:500;opacity:.35;mix-blend-mode:multiply;background-image:var(--grain)}

/* ============ shelf ============ */
#shelf{position:absolute;inset:0;background:radial-gradient(120% 60% at 30% 0%,#FFF8EC,#F3E9DB 55%,#E8DCCB);transition:opacity .5s}
#shelf .sun{position:absolute;left:-20%;top:-10%;width:90%;height:70%;background:linear-gradient(115deg,rgba(255,240,205,.55),transparent 60%);filter:blur(8px);pointer-events:none}
#shelf .hdr{position:absolute;left:24px;right:24px;top:62px}
.edbtn{position:absolute;right:0;top:4px;height:34px;padding:0 14px;border-radius:17px;background:rgba(255,255,255,.75);box-shadow:inset 0 1px 0 #fff,0 4px 12px rgba(90,60,30,.12);display:flex;align-items:center;font-size:13px;color:#6B5A4E;cursor:pointer;transition:all .3s}
.edbtn.on{background:#5d4a73;color:#fff}
.coach{position:absolute;right:20px;top:110px;z-index:40;background:#5d4a73;color:#fff;font-size:12.5px;line-height:1.6;padding:10px 14px;border-radius:14px;box-shadow:0 10px 24px rgba(60,40,80,.3);opacity:0;transform:translateY(-6px);transition:all .4s;pointer-events:none}
.coach.on{opacity:1;transform:none;pointer-events:auto}
.coach::before{content:'';position:absolute;right:30px;top:-6px;border:6px solid transparent;border-top:0;border-bottom-color:#5d4a73}
.coach b{margin-left:8px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.2);font-weight:500;cursor:pointer}
#shelf.editing .spine:not(.add),#shelf.editing .face{animation:wig .5s ease-in-out infinite alternate}
#shelf.editing .spine:nth-child(even){animation-delay:-.25s}
@keyframes wig{from{rotate:-1.2deg}to{rotate:1.2deg}}
.edmark{position:absolute;left:50%;top:-12px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#5d4a73;color:#fff;font-size:12px;font-style:normal;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(60,40,80,.35);opacity:0;transform:scale(.4);transition:all .3s cubic-bezier(.3,1.5,.5,1);pointer-events:none;z-index:3}
#shelf.editing .edmark{opacity:1;transform:none}
#shelf h1{margin:0;font:600 26px/1.2 var(--song);letter-spacing:.08em;color:#4A3D38}
#shelf .en{font:italic 500 14px var(--serif);color:#9A8A7C;letter-spacing:.12em;margin-top:4px}
#shelf .tip{margin-top:14px;font-size:12.5px;color:#9A8A7C;line-height:1.7}
.row{position:absolute;left:0;right:0;overflow-x:auto;overflow-y:visible;scrollbar-width:none;padding:0 26px 0 22px;display:flex;align-items:flex-end;gap:5px}
.row::-webkit-scrollbar{display:none}
.row1{top:200px;height:452px;padding-bottom:0}
.floor{position:absolute;left:0;right:0;top:652px;bottom:0;background:linear-gradient(#EFE5D6,#F6EFE6 40%,#F3ECE3)}
.floor::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;background:rgba(150,120,90,.25)}
.spine,.face{-webkit-box-reflect:below 2px linear-gradient(transparent 55%,rgba(255,255,255,.28))}
.spine{position:relative;flex:0 0 auto;border-radius:2px 3px 2px 2px;cursor:pointer;transform-origin:50% 100%;transition:transform .45s cubic-bezier(.3,1.3,.5,1);
  background-image:linear-gradient(90deg,rgba(0,0,0,.16),rgba(255,255,255,.22) 14%,rgba(255,255,255,.06) 45%,rgba(0,0,0,.06) 82%,rgba(0,0,0,.2)),linear-gradient(180deg,var(--c1),var(--c2));
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08),3px 0 6px -2px rgba(60,40,20,.25)}
.spine::after{content:'';position:absolute;inset:0;border-radius:inherit;background-image:var(--grain);opacity:.35;mix-blend-mode:multiply;pointer-events:none}
.spine:hover{transform:translateY(-6px)}
.spine.pull{transform:translateY(-30px)}
.spine .av{position:absolute;left:50%;top:16px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:#fff center/cover;box-shadow:0 0 0 1.5px rgba(255,255,255,.9),0 2px 4px rgba(0,0,0,.18)}
.spine .tt{position:absolute;left:0;right:0;top:62px;writing-mode:vertical-rl;margin:0 auto;font:600 16px/1 var(--song);letter-spacing:.32em;color:var(--sink);width:100%;display:flex;align-items:center}
.spine .zh{position:absolute;left:0;right:0;bottom:46px;writing-mode:vertical-rl;margin:0 auto;font:500 10px/1 var(--song);letter-spacing:.22em;color:var(--sink);opacity:.7;width:100%;display:flex;align-items:center}
.spine .en{position:absolute;left:0;right:0;bottom:12px;text-align:center;font:italic 6.5px var(--serif);letter-spacing:0;white-space:nowrap;overflow:hidden;color:var(--sink);opacity:.6;line-height:1.2}
.spine .lock{position:absolute;left:50%;top:52px;width:12px;height:12px;margin-left:-6px;opacity:.65}
.spine.add{background:none;border:1.5px dashed #CDB99F;box-shadow:none;display:flex;align-items:center;justify-content:center;color:#B9A386;font-size:22px;-webkit-box-reflect:none}
.spine.add::after{display:none}
.face{position:relative;flex:0 0 auto;width:188px;height:268px;margin-right:12px;cursor:pointer;border-radius:3px 8px 8px 3px;background:#FBF8F2;
  box-shadow:inset 6px 0 6px -4px rgba(0,0,0,.18),inset 0 0 0 .5px rgba(0,0,0,.08),10px 14px 24px -8px rgba(60,40,20,.35);transform:perspective(900px) rotateY(14deg);transform-origin:0 100%;transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
.face:hover{transform:perspective(900px) rotateY(8deg) translateY(-4px)}
.face::after{content:'';position:absolute;inset:0;border-radius:inherit;background-image:var(--grain);opacity:.4;mix-blend-mode:multiply;pointer-events:none}
.cv{position:absolute;inset:0;padding:18px 15px 14px;display:flex;flex-direction:column;align-items:center}
.cv .lg{width:42px;height:42px;border-radius:50%;background:#fff center/cover}
.cv .en{margin-top:6px;font:600 15px var(--serif);letter-spacing:.32em;color:#3c332e}
.cv .zh{font:500 11px var(--song);letter-spacing:.4em;color:#8a7a6c;margin-top:2px}
.cv .gd{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:100%}
.cv .gd i{aspect-ratio:1;background:#ddd center/cover}
.cv .ds{margin-top:auto;font:italic 10px var(--serif);letter-spacing:.14em;color:#9a8a7c}
.lay{flex:0 0 auto;position:relative;width:170px;height:70px;margin-left:6px}
.lay img{position:absolute;left:50%;bottom:-38px;width:118px;transform:translateX(-50%) rotate(-76deg);transform-origin:50% 50%;filter:drop-shadow(-6px 4px 5px rgba(80,55,30,.22))}
.vase{flex:0 0 auto;position:relative;width:120px;height:250px;margin-left:10px}
.entr{position:absolute;left:24px;right:24px;bottom:40px;display:flex;gap:10px}
.entr div{flex:1;height:62px;border-radius:16px;background:rgba(255,255,255,.65);box-shadow:inset 0 1px 0 #fff,0 6px 16px rgba(90,60,30,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:#6B5A4E;gap:2px;cursor:pointer}
.entr div small{font-size:10px;color:#A8988A}

/* ============ flying book / cover ============ */
#fly{position:absolute;left:0;top:0;z-index:300;transform-origin:0 0;perspective:1400px;display:none}
#fly .bk{position:relative;transform-style:preserve-3d}
.cover{position:absolute;inset:0;border-radius:3px 10px 10px 3px;overflow:hidden;transform-origin:0 50%;backface-visibility:hidden;background:#FBF8F2;box-shadow:0 30px 60px rgba(50,30,20,.3),inset 8px 0 8px -5px rgba(0,0,0,.2),inset 0 0 0 .5px rgba(0,0,0,.08)}
.cover::after{content:'';position:absolute;inset:0;background-image:var(--grain);opacity:.4;mix-blend-mode:multiply}
.cover .cv{padding:30px 24px 22px}.cover .cv .lg{width:56px;height:56px}.cover .cv .en{font-size:20px}.cover .cv .zh{font-size:13px}.cover .cv .gd{gap:4px;margin-top:16px}.cover .cv .ds{font-size:12px}
.inner{position:absolute;inset:0;border-radius:4px 10px 10px 4px;background:#FBF7F0;box-shadow:0 30px 60px rgba(50,30,20,.3)}

/* ============ viewer ============ */
#view{position:absolute;inset:0;z-index:200;opacity:0;pointer-events:none;transition:opacity .45s;background:var(--bg);color:var(--ink)}
#view.on{opacity:1;pointer-events:auto}
#view .top{position:absolute;left:0;right:0;top:0;height:108px;z-index:20;display:flex;align-items:flex-end;padding:0 14px 16px;gap:8px;background:linear-gradient(var(--bg) 70%,transparent)}
#view.dark .top{background:none}
#view.dark .ttl{color:#F1E6D0}
.pill{height:34px;padding:0 13px;border-radius:17px;background:rgba(255,255,255,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 2px 10px rgba(0,0,0,.08);display:flex;align-items:center;gap:4px;font-size:13px;color:inherit;cursor:pointer;white-space:nowrap}
.dark .pill{background:rgba(255,255,255,.12);color:#EDE6F5}
#view .edp{display:inline-block;margin-left:4px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.7);font:500 11px -apple-system,sans-serif;letter-spacing:0;vertical-align:2px;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer}
#view.dark .edp{background:rgba(255,255,255,.15)}
#view .ttl{flex:1;text-align:center;font:600 16px var(--song);letter-spacing:.1em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stage{position:absolute;inset:0}
#forms{position:absolute;left:12px;right:12px;top:100px;z-index:30;border-radius:20px;background:rgba(255,252,248,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(40,25,15,.25);padding:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;transform:translateY(-12px) scale(.96);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.3,1.3,.5,1);color:#4A3D38}
#forms.on{transform:none;opacity:1;pointer-events:auto}
#forms .f{aspect-ratio:1;border-radius:14px;background:#F3EDE6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;cursor:pointer;position:relative}
#forms .f svg{width:26px;height:26px}
#forms .f.on{background:var(--acc);color:#fff}
#forms .f.soon{opacity:.45}
#forms .f.soon::after{content:'即将上线';position:absolute;bottom:4px;font-size:8.5px;color:#9A8A7C}
#forms .f.soon span{margin-bottom:8px}
#forms .h{grid-column:1/-1;font-size:12px;color:#9A8A7C;padding:2px 4px 4px}

/* --- page book --- */
.pb{position:absolute;left:50%;top:118px;width:min(84%,340px);transform:translateX(-50%);aspect-ratio:3/4.3;perspective:1600px}
.pg{position:absolute;inset:0;border-radius:3px 12px 12px 3px;background:var(--paper);box-shadow:0 18px 40px rgba(60,40,25,.18),inset 6px 0 10px -6px rgba(0,0,0,.18);transform-origin:0 50%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.45,.05,.2,1);backface-visibility:hidden;overflow:hidden;padding:26px 24px}
.pg.turned{transform:rotateY(-178deg)}
.pg::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.08),transparent 12%);}
.pg .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent 30%,rgba(0,0,0,.18));opacity:0;transition:opacity .9s}
.pg.turning .shade{opacity:1}
.pg .ph{width:100%;aspect-ratio:1/1;border-radius:4px;background:#ddd center/cover;box-shadow:0 6px 14px rgba(0,0,0,.18);border:7px solid #fff;border-bottom-width:30px;transform:rotate(-1.5deg)}
.pg .dt{margin-top:16px;font:italic 13px var(--serif);letter-spacing:.1em;color:var(--ink2)}
.pg .ti{font:24px/1.3 var(--hand);margin-top:4px}
.pg .tx{font:16px/1.75 var(--hand);color:var(--ink2);margin-top:6px}
.pg .no{position:absolute;bottom:12px;right:18px;font:italic 12px var(--serif);color:var(--ink2);opacity:.6}
.pg.title{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pg.title .av{width:120px;height:120px;border-radius:50%;background:#fff center/cover;box-shadow:0 0 0 6px rgba(255,255,255,.7),0 10px 24px rgba(0,0,0,.15)}
.pg.title .nm{font:600 34px var(--song);letter-spacing:.24em;margin-top:26px}
.pg.title .sb{font:italic 14px var(--serif);letter-spacing:.12em;color:var(--ink2);margin-top:10px}
.pg.title .ds{margin-top:26px;padding:7px 16px;border-radius:20px;background:var(--acc);color:#fff;font-size:12.5px;letter-spacing:.1em}
.pgnav{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:12px;color:var(--ink2);opacity:.8}

/* --- timeline --- */
.tl{position:absolute;inset:0;overflow-y:auto;padding:120px 22px 90px 22px;scrollbar-width:none}
.tl::-webkit-scrollbar{display:none}
.tl .head{font:28px/1.3 var(--hand);margin:0 0 6px 6px}
.tl .lead{font-size:13px;color:var(--ink2);line-height:1.7;margin:0 0 24px 6px}
.tl .line{position:relative;padding-left:92px}
.tl .line::before{content:'';position:absolute;left:70px;top:0;bottom:0;width:1px;background:repeating-linear-gradient(var(--ink2) 0 3px,transparent 3px 7px);opacity:.5}
.tl .it{position:relative;margin-bottom:28px;opacity:.25;transform:translateY(14px);transition:all .7s cubic-bezier(.3,1,.4,1)}
.tl .it.on{opacity:1;transform:none}
.tl .yr{position:absolute;left:-92px;top:2px;width:62px;text-align:right;font:600 15px var(--serif);color:var(--ink2)}
.tl .dot{position:absolute;left:-27px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:1.5px solid var(--ink2);transition:all .5s}
.tl .it.on .dot{background:var(--acc);border-color:var(--acc);box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 22%,transparent)}
.tl .card{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.tl .card .im{flex:0 0 64px;height:64px;border-radius:6px;background:#ddd center/cover;box-shadow:0 3px 8px rgba(0,0,0,.15);border:3px solid #fff}
.tl .card b{display:block;font-weight:600;font-size:14.5px;margin-bottom:3px}
.tl .card span{font-size:12.5px;color:var(--ink2);line-height:1.6}

/* --- museum --- */
.mu{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;background:radial-gradient(120% 70% at 50% 20%,#7E2E36,#5A1E26 70%,#3E1218);padding:120px 16px 80px}
.mu::-webkit-scrollbar{display:none}
.mu::before{content:'';position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 5px);opacity:.6}
.mu .mt{text-align:center;color:#F1D79A;font:600 20px var(--song);letter-spacing:.3em}
.mu .ms{text-align:center;color:#D9B98A;font:italic 12px var(--serif);letter-spacing:.2em;margin:6px 0 26px;opacity:.8}
.mu .g{display:grid;grid-template-columns:1fr 1fr;gap:26px 14px;align-items:start}
.fr{position:relative;cursor:pointer;transform-origin:50% 0;animation:hang .9s cubic-bezier(.3,1.4,.5,1) both}
@keyframes hang{0%{transform:translateY(-30px) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.fr .gold{position:relative;padding:11px;background:conic-gradient(from 30deg,#8A6A2A,#F6E3A6,#B88C3E,#FFF1C2,#9C7633,#E9CD85,#8A6A2A);box-shadow:0 14px 22px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,240,200,.6)}
.fr .gold::before{content:'';position:absolute;inset:5px;border:1.5px solid rgba(120,85,30,.6);pointer-events:none}
.fr .gold .im{aspect-ratio:4/5;background:#ddd center/cover;box-shadow:inset 0 0 12px rgba(0,0,0,.45)}
.fr.oval .gold,.fr.oval .gold::before,.fr.oval .im{border-radius:50%}
.fr.heart .gold{clip-path:path('M 0 0')}
.fr .orn{position:absolute;left:50%;top:-12px;width:46px;margin-left:-23px;height:18px}
.fr .plq{margin:10px auto 0;width:78%;padding:5px 0;text-align:center;font-size:10.5px;letter-spacing:.12em;color:#4a3518;background:linear-gradient(#F3DFA4,#C9A05A);border-radius:2px;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.fr .plq i{display:block;font:italic 9.5px var(--serif);opacity:.75;margin-top:1px}
.mu .lamp{position:absolute;left:50%;top:0;width:70%;height:30px;transform:translateX(-50%);background:radial-gradient(50% 100% at 50% 0,rgba(255,220,160,.35),transparent)}

/* --- stars --- */
.st{position:absolute;inset:0;background:radial-gradient(130% 80% at 50% 100%,rgba(75,61,110,.55),rgba(37,31,61,.6) 55%,rgba(18,15,34,.85)),var(--stbg) center/cover,#120F22}
.st canvas{position:absolute;inset:0;width:100%;height:100%}
.st .cap{position:absolute;left:0;right:0;top:118px;text-align:center;color:#EDE6F5;pointer-events:none}
.st .cap b{display:block;font:600 22px var(--song);letter-spacing:.25em}
.st .cap span{display:block;margin-top:8px;font:italic 13px var(--serif);letter-spacing:.14em;opacity:.75}
.st .hz{position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(transparent,rgba(255,200,150,.12));pointer-events:none}
.st .hint{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:12px;color:#BFB3D6;opacity:.8}

/* --- box --- */
.bx{position:absolute;inset:0;background:radial-gradient(100% 60% at 50% 70%,color-mix(in srgb,var(--bg) 70%,#fff),var(--bg))}
.bx .box{position:absolute;left:50%;bottom:150px;width:230px;height:170px;margin-left:-115px;cursor:pointer}
.bx .body{position:absolute;left:0;right:0;bottom:0;height:120px;border-radius:6px;background:linear-gradient(90deg,#C99F72,#E2BF94 40%,#D2A87C 70%,#B58A5E);box-shadow:0 26px 40px -10px rgba(70,40,20,.45),inset 0 -6px 0 rgba(0,0,0,.08)}
.bx .body::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:26px;margin-left:-13px;background:var(--acc);opacity:.85}
.bx .body::after{content:'';position:absolute;left:14px;right:14px;top:10px;height:1px;background:rgba(80,50,20,.25)}
.bx .lid{position:absolute;left:-8px;right:-8px;bottom:112px;height:40px;border-radius:6px;background:linear-gradient(90deg,#D3AA7D,#EDCDA4 40%,#DDB488 70%,#C29669);box-shadow:0 6px 10px rgba(70,40,20,.25);transform-origin:10% 100%;transition:transform 1s cubic-bezier(.4,1.4,.5,1)}
.bx .lid::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:26px;margin-left:-13px;background:var(--acc);opacity:.9}
.bx .bow{position:absolute;left:50%;top:-22px;width:70px;margin-left:-35px}
.bx.open .lid{transform:translate(-110px,40px) rotate(-14deg)}
.bx .tag{position:absolute;right:-16px;bottom:30px;padding:6px 10px;background:#FBF4E6;border-radius:3px;font:15px var(--hand);transform:rotate(8deg);box-shadow:0 3px 6px rgba(0,0,0,.18)}
.bx .item{position:absolute;left:50%;bottom:230px;width:74px;cursor:pointer;opacity:0;transition:transform 1s cubic-bezier(.3,1.3,.5,1),opacity .5s}
.bx .item .im{width:100%;aspect-ratio:1;background:#ddd center/cover;border:4px solid #fff;border-bottom-width:18px;box-shadow:0 10px 18px rgba(0,0,0,.2)}
.bx .item .lb{position:absolute;left:0;right:0;bottom:1px;text-align:center;font:11px var(--hand);white-space:nowrap;overflow:hidden;color:#6b5a52}
.bx .hint{position:absolute;left:0;right:0;bottom:60px;text-align:center;font-size:12.5px;color:var(--ink2)}
.bx .head{position:absolute;left:0;right:0;top:122px;text-align:center;font:26px var(--hand)}

/* --- detail card --- */
#det{position:absolute;inset:0;z-index:265;display:flex;align-items:center;justify-content:center;pointer-events:none}
#det .dim{position:absolute;inset:0;background:rgba(30,20,20,.45);opacity:0;transition:opacity .35s}
#det.on{pointer-events:auto}#det.on .dim{opacity:1}

  const set=(ni,anim)=>{ni=Math.max(0,Math.min(n+1,ni));if(ni===i&&anim)return;const dir=ni>i?1:-1;const turning=dir>0?leaves.slice(i,ni):leaves.slice(ni,i);
    turning.forEach(L=>{L.style.zIndex=n+5;L.classList.add('turning');setTimeout(()=>L.classList.remove('turning'),900)});i=ni;leaves.forEach((L,j)=>L.classList.toggle('turned',j<i));setTimeout(z,anim?450:0);if(!anim)z();
    nav.textContent=i===0?'← 滑动或点右边翻开 →':i>n?'翻完啦 · 点左边往回翻':`第 ${i} 页 / 共 ${n} 页`;anim&&noise(.25,.07,2500)};
  const nav=document.createElement('div');nav.className='pgnav';S.appendChild(nav);
  if(!anim0())set(0,false);function anim0(){if(focus!=null&&focus>=0){leaves.forEach(L=>L.style.transition='none');set(focus+1,false);requestAnimationFrame(()=>leaves.forEach(L=>L.style.transition=''));return true}return false}
  let sx=null,sy=0,drag=null;wrap.onpointerdown=e=>{sx=e.clientX;sy=e.clientY;const c=e.target.closest('.cph');if(c){const F=c.closest('.fc').getBoundingClientRect();drag={c,F,moved:false,ox:parseFloat(c.style.left),oy:parseFloat(c.style.top)};c.setPointerCapture&&c.setPointerCapture(e.pointerId)}};
  wrap.onpointermove=e=>{if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!drag.moved&&Math.hypot(dx,dy)<6)return;drag.moved=true;drag.c.classList.add('lift');
    const x=Math.max(8,Math.min(92,drag.ox+dx/drag.F.width*100)),y=Math.max(8,Math.min(92,drag.oy+dy/drag.F.height*100));drag.c.style.left=x+'%';drag.c.style.top=y+'%'};
  wrap.onpointerup=e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;const t=e.target;
    if(drag){const d=drag;drag=null;d.c.classList.remove('lift');if(d.moved){const m=M[+d.c.dataset.k];m.pos=m.pos||{};m.pos[d.c.dataset.j]=[parseFloat(d.c.style.left),parseFloat(d.c.style.top)];saveM(b,m);return}}
    if(t.closest('.ed')){detail(M[+t.closest('.ed').dataset.k]);return}if(t.closest('#bkAdd')){addMemory();return}if(t.closest('.nopic')){detail(M[+t.closest('.nopic').dataset.k]);return}if(t.closest('.cph')){detail(M[+t.closest('.cph').dataset.k]);return}
    if(Math.abs(dx)>30)set(i+(dx<0?1:-1),true);else{const r=wrap.getBoundingClientRect();set(i+(e.clientX>r.left+r.width/2?1:-1),true)}};
  wrap.animate([{transform:'translateX(-50%) translateY(24px)',opacity:0},{transform:'translateX(-50%)',opacity:1}],{duration:550,easing:'cubic-bezier(.3,1.2,.5,1)'})}

/* --- 时间轴 --- */
function fTimeline(S,b,focus){const d=document.createElement('div');d.className='tl';S.appendChild(d);
  d.innerHTML=`<div class="head">${b.kind==='mem'?'她走过的日子':'一路走来'}</div><div class="lead">${b.sub} · ${b.days}<br>往下滑，一点一点想起来。</div><div class="line">${b.m.map((m,k)=>`<div class="it" data-k="${k}"><div class="yr">${m.y}</div><div class="dot"></div><div class="card"><div class="im" style="background-image:url('${imgOf(m.i)}')"></div><div><b>${m.t}</b><span>${m.x}</span></div></div></div>`).join('')}</div>`;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('on')}),{root:d,rootMargin:'0px 0px -18% 0px'});
  d.querySelectorAll('.it').forEach(e=>{io.observe(e);e.querySelector('.card').onclick=()=>detail(b.m[+e.dataset.k])});
  if(focus!=null){const e=d.querySelector(`.it[data-k="${focus}"]`);if(e){e.classList.add('on','hl');setTimeout(()=>e.scrollIntoView({block:'center',behavior:'smooth'}),80)}}}

/* --- 博物馆墙 --- */
function fMuseum(S,b,focus){const d=document.createElement('div');d.className='mu';S.appendChild(d);
  const shapes=['oval','rect','rect','oval','rect','oval','rect','oval'];
  d.innerHTML=`<div class="lamp"></div><div class="mt">${b.name} 博物馆</div><div class="ms">THE MUSEUM OF ${b.id.toUpperCase()} · ${b.days}</div><div class="g">${b.m.map((m,k)=>`<div class="fr ${shapes[k%shapes.length]}" data-k="${k}" style="animation-delay:${k*.12}s;margin-top:${k%2?30:0}px"><svg class="orn" viewBox="0 0 46 18"><path d="M2 16 C 8 2 18 14 23 3 C 28 14 38 2 44 16" fill="none" stroke="#E9CD85" stroke-width="3"/><circle cx="23" cy="5" r="3.5" fill="#F6E3A6"/></svg><div class="gold"><div class="im" style="background-image:url('${imgOf(m.i)}')"></div></div><div class="plq">${m.t}<i>${m.d}</i></div></div>`).join('')}</div>`;
  d.querySelectorAll('.fr').forEach(e=>e.onclick=()=>{e.animate([{transform:'perspective(700px) rotateY(0)'},{transform:'perspective(700px) rotateY(90deg) scale(1.06)'}],{duration:320,easing:'ease-in'});setTimeout(()=>detail(b.m[+e.dataset.k]),300)});
  if(focus!=null){const e=d.querySelector(`.fr[data-k="${focus}"]`);if(e){e.classList.add('hl');setTimeout(()=>e.scrollIntoView({block:'center',behavior:'smooth'}),80)}}}

/* --- 星空 --- */
let starRAF=0;function stopStars(){cancelAnimationFrame(starRAF)}
function fStars(S,b,focus){const d=document.createElement('div');d.className='st';if(A.x_G16)d.style.setProperty('--stbg',`url(${A.x_G16})`);S.appendChild(d);
  d.innerHTML=`<canvas></canvas><div class="cap"><b>${b.name}</b><span>${b.days}</span></div><div class="hz"></div><div class="hint">每一颗亮星，都是一段回忆 · 点一颗看看</div>`;
  const c=d.querySelector('canvas'),r=d.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);c.width=r.width*dpr;c.height=r.height*dpr;const g=c.getContext('2d');g.scale(dpr,dpr);const W=r.width,H=r.height;
  const bg=Array.from({length:180},()=>({x:Math.random()*W,y:Math.random()*H*.85,r:Math.random()*1.2+.2,p:Math.random()*6}));
  // constellation path
  const n=b.m.length,ms=b.m.map((m,k)=>{const t=k/(n-1||1);return {x:W*(.5+.3*Math.sin(t*Math.PI*2.2+.6)*(k%2?1:.82)),y:H*(.24+t*.56),m}});
  const t0=performance.now();
  const f=t=>{const s=(t-t0)/1000;g.clearRect(0,0,W,H);
    bg.forEach(p=>{g.globalAlpha=.35+.35*Math.sin(s*1.5+p.p);g.fillStyle='#fff';g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill()});
    g.globalAlpha=1;const shown=Math.min(n,s*1.6);
    g.strokeStyle='rgba(230,215,255,.45)';g.lineWidth=1;g.setLineDash([3,4]);g.beginPath();
    for(let k=0;k<Math.floor(shown);k++){const a=ms[k],bb=ms[k+1];if(!bb)break;const q=Math.min(1,shown-k-1+1);if(k+1>shown)break;g.moveTo(a.x,a.y);g.lineTo(a.x+(bb.x-a.x)*Math.min(1,shown-(k+1)+1),a.y+(bb.y-a.y)*Math.min(1,shown-(k+1)+1))}
    g.stroke();g.setLineDash([]);
    ms.forEach((p,k)=>{if(k>shown)return;const tw=1+.15*Math.sin(s*2+k);const gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,22*tw);gr.addColorStop(0,'rgba(255,248,230,.95)');gr.addColorStop(.25,'rgba(230,210,255,.5)');gr.addColorStop(1,'rgba(200,180,255,0)');g.fillStyle=gr;g.beginPath();g.arc(p.x,p.y,22*tw,0,7);g.fill();
      g.fillStyle='#fff';g.beginPath();for(let j=0;j<8;j++){const ang=j*Math.PI/4,rr=j%2?1.6:5*tw;g.lineTo(p.x+Math.cos(ang)*rr,p.y+Math.sin(ang)*rr)}g.fill();
      g.fillStyle='rgba(237,230,245,.75)';g.font='11px PingFang SC,sans-serif';g.textAlign='center';g.fillText(p.m.t,p.x,p.y+26)});
    starRAF=requestAnimationFrame(f)};starRAF=requestAnimationFrame(f);
  c.onpointerup=e=>{const R=c.getBoundingClientRect(),x=(e.clientX-R.left)*W/R.width,y=(e.clientY-R.top)*H/R.height;let best=null,bd=52;ms.forEach(p=>{const dd=Math.hypot(p.x-x,p.y-y);if(dd<bd){bd=dd;best=p}});if(best)detail(best.m)}}

/* --- 盒子 --- */
function fBox(S,b,focus){const d=document.createElement('div');d.className='bx';S.appendChild(d);
  d.innerHTML=`<div class="head">${b.kind==='ex'?'那年夏天留下的东西':'TA 的小盒子'}</div><div class="box"><div class="body"></div><div class="lid"><svg class="bow" viewBox="0 0 70 30"><path d="M35 15 C 20 0 4 4 8 15 C 4 26 20 30 35 15 C 50 30 66 26 62 15 C 66 4 50 0 35 15Z" fill="${SK[b.kind].acc}"/><circle cx="35" cy="15" r="5" fill="${SK[b.kind].acc}" stroke="rgba(0,0,0,.15)"/></svg></div><div class="tag">${b.name}</div></div><div class="hint">轻点盒子，打开它</div>`;
  const bx=d.querySelector('.box');let open=false;
  bx.onclick=()=>{if(open)return;open=true;d.classList.add('open');d.querySelector('.hint').textContent='点一件，看看它的故事';
    const n=b.m.length,W=d.clientWidth;b.m.forEach((m,k)=>{const it=document.createElement('div');it.className='item';it.innerHTML=`<div class="im" style="background-image:url('${imgOf(m.i)}')"></div><div class="lb">${m.t}</div>`;
      d.appendChild(it);const row=k%2,a=(k/(n-1||1)-.5)*Math.PI*.92,R=Math.min(W*.4,165)-row*0,x=Math.sin(a)*R-37,y=-Math.cos(a)*R*.85-(row?110:20),rot=a*22;
      it.style.transform=`translate(-37px,60px) scale(.3)`;requestAnimationFrame(()=>requestAnimationFrame(()=>{it.style.transitionDelay=(0.25+k*.09)+'s';it.style.opacity=1;it.style.transform=`translate(${x}px,${y}px) rotate(${rot}deg)`}));
      it.onclick=e=>{e.stopPropagation();detail(m)}})};
  if(focus!=null||b._boxOpen)setTimeout(()=>bx.onclick(),focus!=null?250:0);const _o=bx.onclick;bx.onclick=()=>{b._boxOpen=1;_o()}}

/* --- edit book info --- */
function editBook(b){const E=$('#ed'),S=E.querySelector('.sh');
  S.innerHTML=`<h3>编辑这本书</h3><div class="two"><div><label>名字</label><input id="eN" maxlength="8" value="${b.name}"></div><div><label>英文小字</label><input id="eE" maxlength="12" value="${b.en||EN[b.kind]}"></div></div>
   <label>一句话（扉页上的副标题）</label><input id="eS" maxlength="24" value="${b.sub}">
   <label>从哪一天开始算</label><input id="eD" type="date" value="${b.start||''}">
   <label>天数前面写什么</label><div class="chips">${PREF.map(p=>`<div class="chip ${b.pref===p?'on':''}" data-p="${p}">${p} N 天</div>`).join('')}</div>
   <div class="pv" id="ePv"></div><div class="go" id="eGo">保存</div>`;
  let pref=b.pref;const pv=()=>{const t={...b,start:S.querySelector('#eD').value,pref};S.querySelector('#ePv').textContent='书脊上会写：'+daysText(t)};pv();
  S.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{pref=c.dataset.p;S.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));pv()});S.querySelector('#eD').oninput=pv;
  S.querySelector('#eGo').onclick=()=>{b.name=S.querySelector('#eN').value.trim()||b.name;b.en=S.querySelector('#eE').value.trim().toUpperCase()||b.en;b.sub=S.querySelector('#eS').value.trim();b.start=S.querySelector('#eD').value||b.start;b.pref=pref;b.days=daysText(b);
    saveInfo(b);E.classList.remove('on');buildShelf();if(cur===b&&$('#view').classList.contains('on')){$('#vt').textContent=b.name;render(cur._f||b.form);b._el.style.visibility='hidden'}toast('改好啦')};
  E.classList.add('on');E.querySelector('.dim').onclick=()=>E.classList.remove('on')}
/* --- detail：每一段回忆都能改：照片可加可删、日期标题文字直接点着改、也能删掉这一段 --- */
function detail(m){const D=$('#det'),C=D.querySelector('.card');C.style.setProperty('--acc',SK[cur.kind].acc);const b=cur;
  let P=[m.i].concat(m.more||[]).filter(Boolean),pi=0;
  const draw=()=>{C.innerHTML=`<div class="gal"><div class="im" style="background-image:url('${P.length?imgOf(P[pi]):NOPH}')">${P.length?'<div class="rm" id="dRm">✕ 删掉这张</div>':'<div class="addph" id="dAdd1">＋ 加一张照片</div>'}</div>
      <div class="thb">${P.map((x,k)=>`<div class="t ${k===pi?'on':''}" data-k="${k}" style="background-image:url('${imgOf(x)}')"></div>`).join('')}<div class="t add" id="dAdd">＋</div></div></div>
    ${P.length?`<div class="pcap"><span>这张照片 ${pi+1}/${P.length} 的记录</span><div contenteditable="true" id="dCap" data-ph="给这张照片写一句…">${esc(P[pi].cap||'')}</div></div>`:''}
    <div class="dt" contenteditable="true" data-f="d">${esc(m.d)}</div><div class="ti" contenteditable="true" data-f="t">${esc(m.t)}</div><div class="tx" contenteditable="true" data-f="x">${esc(m.x||'')}</div>
    <div class="dh">✎ 文字点一下就能改 · 照片可以加、可以删</div><div class="bt"><div id="dDel" class="del">删掉这段</div><div id="dClose">好了</div><div class="pri" id="dWrite">${b.kind==='mem'?'给 TA 写封信':b.kind==='ex'?'放进玻璃瓶':'写点什么'}</div></div>`;
    C.querySelectorAll('[contenteditable]').forEach(e=>{e.onblur=()=>{m[e.dataset.f]=e.innerText.trim();if(e.dataset.f==='d')m.y=(m.d.match(/\d{4}/)||[m.y])[0];saveM(b,m)};e.onkeydown=ev=>{if(ev.key==='Enter'&&e.dataset.f!=='x'){ev.preventDefault();e.blur()}}});
    C.querySelectorAll('.thb .t[data-k]').forEach(t=>t.onclick=()=>{pi=+t.dataset.k;draw()});
    const dc=C.querySelector('#dCap');if(dc){dc.onblur=()=>{const v=dc.innerText.trim();if(typeof P[pi]==='object'){P[pi]=Object.assign({},P[pi],{cap:v});commit()}};dc.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();dc.blur()}}}
    const add=()=>pickImg(u=>{P.push({data:u});pi=P.length-1;commit();draw();setTimeout(()=>{const c=C.querySelector('#dCap');c&&c.focus()},120)},900);C.querySelector('#dAdd').onclick=add;const a1=C.querySelector('#dAdd1');a1&&(a1.onclick=add);
    const rm=C.querySelector('#dRm');rm&&(rm.onclick=()=>{P.splice(pi,1);pi=Math.max(0,pi-1);commit();draw()});
    C.querySelector('#dDel').onclick=async()=>{if(!await askOk('确定删掉这一段回忆吗？','删掉'))return;const k=b.m.indexOf(m);if(m._new||b.custom){b.m.splice(k,1);saveExtra(b)}else{m.del=1;saveM(b,m);b.m.splice(k,1)}close(Math.max(0,k-1));toast('删掉了')};
    C.querySelector('#dClose').onclick=()=>close();C.querySelector('#dWrite').onclick=()=>openExt('mail',{to:b.name})};
  const commit=()=>{m.i=P[0]||null;m.more=P.slice(1);m._ich=1;saveM(b,m)};
  const close=(fk)=>{document.activeElement&&document.activeElement.blur&&document.activeElement.blur();D.classList.remove('on');const k=fk!=null?fk:b.m.indexOf(m);render(cur._f||cur.form,b.m.length?k:null);buildShelf();const sp=b._open&&b._open.isConnected?b._open:b._el;sp&&(sp.style.visibility='hidden')};
  draw();D.classList.add('on');D.querySelector('.dim').onclick=()=>close()}
</script>
