<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Make Again · 照片墙</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--hand:"Long Cang","Kaiti SC","STKaiti",KaiTi,serif;--serif:"Cormorant Garamond",Georgia,serif;--ink:#4A3D58;--ink2:#9A8EA6}
html,body{margin:0;height:100%;background:#D9D2DF;font-family:-apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;color:var(--ink);overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#app{position:relative;width:min(100vw,430px);height:min(100vh,900px);overflow:hidden;background:linear-gradient(180deg,#F7F3F6 0%,#F1ECF1 60%,#EEE8EE 100%);user-select:none;-webkit-user-select:none}
@media (min-width:500px){#app{border-radius:40px;box-shadow:0 40px 100px rgba(50,30,70,.3)}}

/* ---------- header / tabbar ---------- */
.hd{position:absolute;left:0;right:0;top:0;height:92px;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px}
.hd .t{font-size:17px;font-weight:600;letter-spacing:.06em}
.hd .cap{position:absolute;right:12px;bottom:8px;height:32px;width:88px;border-radius:16px;background:rgba(255,255,255,.75);border:.5px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-around}
.hd .cap i{display:block}.hd .cap .d{width:18px;height:4px;background:radial-gradient(circle,#222 1.6px,transparent 2px) 0 0/6px 4px}
.hd .cap .o{width:16px;height:16px;border:2px solid #222;border-radius:50%;position:relative}.hd .cap .o::after{content:'';position:absolute;inset:3px;background:#222;border-radius:50%}
.hd .lamp{position:absolute;left:14px;bottom:8px;height:32px;padding:0 12px;border-radius:16px;background:rgba(255,255,255,.75);border:.5px solid rgba(0,0,0,.08);font-size:12.5px;display:flex;align-items:center;gap:5px;color:#6b5a52;cursor:pointer}
.tb{position:absolute;left:0;right:0;bottom:0;height:84px;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:.5px solid rgba(0,0,0,.06);display:flex;justify-content:space-around;padding-top:9px}
.tb div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#9a93a3;width:70px}
.tb div.on{color:#7d68a3}.tb svg{width:24px;height:24px}

/* ---------- board ---------- */
#wallWrap{position:absolute;left:0;right:0;top:92px;bottom:84px;}
#frame{position:absolute;left:12px;right:12px;top:10px;bottom:14px;border-radius:7px;background:#3b2a22;padding:9px;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 18px 30px -10px rgba(60,35,20,.45),0 3px 6px rgba(60,35,20,.25);
  background-image:linear-gradient(90deg,rgba(255,255,255,.06),transparent 30%,rgba(0,0,0,.08) 70%,rgba(255,255,255,.04)),repeating-linear-gradient(90deg,rgba(0,0,0,.08) 0 1px,transparent 1px 7px)}
#board{position:absolute;inset:9px;border-radius:2px;overflow:hidden;background:#9a6c45;filter:brightness(.9) saturate(.95);transition:filter .8s;box-shadow:inset 0 2px 6px rgba(0,0,0,.35),inset 0 0 30px rgba(60,40,25,.25)}
#felt{position:absolute;inset:0;background-size:cover}
#light{position:absolute;inset:0;pointer-events:none;z-index:900;transition:opacity .8s;opacity:0;
  background:radial-gradient(150% 110% at 50% -6%,rgba(255,214,150,.32) 0,rgba(255,196,120,.2) 50%,rgba(255,170,90,.1) 100%);mix-blend-mode:soft-light}
#light2{position:absolute;inset:0;pointer-events:none;z-index:901;opacity:0;transition:opacity .8s;background:radial-gradient(130% 90% at 50% -4%,rgba(255,226,170,.16),rgba(255,206,140,.07) 60%,rgba(255,190,120,.03) 100%);mix-blend-mode:screen}
#app.lit #light,#app.lit #light2{opacity:1}
#app.lit #board{filter:saturate(1.1) brightness(1.04)}
#app.lit #frame{box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 18px 40px -6px rgba(255,170,80,.35),0 3px 6px rgba(60,35,20,.25)}
#app #wallWrap::before{content:'';position:absolute;left:50%;top:-30px;width:140%;height:90%;transform:translateX(-50%);background:radial-gradient(50% 50% at 50% 0,rgba(255,214,150,.35),transparent 70%);opacity:0;transition:opacity .8s;pointer-events:none}
#app.lit #wallWrap::before{opacity:1}
#app.lit .hd,#app.lit .tb{}
#lampEl{position:absolute;left:50%;margin-left:-40px;top:-14px;width:80px;height:66px;z-index:60;cursor:pointer;transform-origin:10px 6px}
#lampEl .bulb{transition:fill .4s,filter .4s;fill:#cfc4ae}
#app.lit #lampEl .bulb{fill:#fff3cf;filter:drop-shadow(0 0 4px #ffd27a) drop-shadow(0 0 10px #ffc96a)}

/* garland */
#items{position:absolute;inset:9px;z-index:5;overflow:visible;pointer-events:none}
#items .it{pointer-events:auto}
#garland{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}

/* ---------- items ---------- */
.it{position:absolute;width:0;height:0;touch-action:none}
.it .sw{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.it .bd{position:absolute;cursor:pointer}
.it .bd img.im{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.it.cut .bd{filter:drop-shadow(1.5px 3px 2.5px rgba(45,28,15,.38))}
.it.card .bd{box-shadow:1px 3px 5px rgba(45,28,15,.33),0 0 1px rgba(45,28,15,.3)}
.it.lift .sw{transition:none}
.it.lift.cut .bd{filter:drop-shadow(6px 18px 12px rgba(45,28,15,.28))}
.it.lift.card .bd{box-shadow:6px 20px 24px rgba(45,28,15,.28),0 0 1px rgba(45,28,15,.3)}
.it.hid{visibility:hidden}

/* framed photo */
.ph{position:relative;background:#fbf8f2;padding:6% 6% 6%}
.ph .pic{position:relative;width:100%;overflow:hidden;background:#ddd}
.ph .pic img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.ph .pic::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18),transparent 40%,rgba(0,0,0,.05));pointer-events:none}
.ph .cap{font:clamp(11px,3.2vw,14px)/1.2 var(--hand);color:#5a4a42;text-align:center;padding-top:5%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.2em}
.ph.f-pola{padding:6% 6% 4%}.ph.f-pola .cap{padding:8% 0 6%}
.ph.f-white{padding:5%}.ph.f-white .cap{display:none}
.ph.f-cream{background:#f3ead8;padding:5%}.ph.f-cream .cap{display:none}
.ph.f-pink{background:#f2c9d0}.ph.f-mint{background:#b9ddd2}.ph.f-blue{background:#bccbe4}.ph.f-ink{background:#2c2733}.ph.f-ink .cap{color:#e9e2ee}
.ph.f-dot{background:#fffaf4 radial-gradient(circle,#e46a6a 1.3px,transparent 1.8px) 0 0/8px 8px}
.ph.f-dot .pic{outline:3px solid #fffaf4}
.ph.f-check{background:#f6eef5;background-image:linear-gradient(90deg,rgba(176,150,206,.45) 50%,transparent 50%),linear-gradient(rgba(176,150,206,.45) 50%,transparent 50%);background-size:10px 10px}
.ph.f-check .pic{outline:3px solid #fbf8f2}
.ph.f-none{padding:0;background:none}.ph.f-none .cap{display:none}
.ph.f-strip{background:#1f1b22;padding:7% 7% 3%}.ph.f-strip .pic{margin-bottom:5%}.ph.f-strip .cap{color:#e8e0ea;font-size:11px;padding:2% 0 5%}

/* text on tickets */
.tkt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;color:#5c4636;padding:0 22% 0 10%;text-align:center}
.tkt b,.tkt em{white-space:nowrap}
.tkt b{font:600 clamp(9px,2.6vw,12px)/1.1 var(--serif);letter-spacing:.12em;opacity:.7}
.tkt span{font:clamp(12px,3.6vw,16px)/1.15 var(--hand);white-space:nowrap;margin-top:2px}
.tkt em{font:normal 9px/1 var(--serif);opacity:.65;margin-top:3px;letter-spacing:.05em}
.env-lab{position:absolute;left:0;right:0;bottom:13%;text-align:center;font:clamp(13px,3.8vw,16px)/1 var(--hand);color:#6b5070;pointer-events:none}
.env-badge{position:absolute;right:4%;top:-6%;min-width:20px;height:20px;border-radius:10px;background:#d4727c;color:#fff;font:600 11px/20px system-ui;text-align:center;padding:0 6px;box-shadow:0 2px 5px rgba(120,40,50,.35);pointer-events:none}

/* fasteners */
.fx{position:absolute;left:0;top:0;pointer-events:none;z-index:5}
.fx.bead{width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7e6 0,#f0d9b0 25%,#c9a676 70%,#9b774b 100%);box-shadow:1.5px 3px 3px rgba(40,25,10,.45)}
.fx.bead::after{content:'';position:absolute;left:4px;top:3px;width:4px;height:3px;border-radius:50%;background:rgba(255,255,255,.7)}
.fx.pin{width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.9) 0,var(--pc,#e9a5b8) 30%,color-mix(in srgb,var(--pc,#e9a5b8) 70%,#000) 100%);box-shadow:1.5px 3px 3px rgba(40,25,10,.4)}
.fx.clip{width:13px;height:40px;margin:-24px 0 0 -6.5px;border-radius:3px;background:linear-gradient(90deg,#c9a77c,#e9cfa6 40%,#d9b88b 60%,#b8936a);box-shadow:1px 3px 3px rgba(40,25,10,.35)}
.fx.clip::before{content:'';position:absolute;left:-1px;right:-1px;top:14px;height:5px;background:linear-gradient(#cfd1d4,#8d9095);border-radius:2px}
.fx.clip::after{content:'';position:absolute;left:6px;top:0;bottom:0;width:1px;background:rgba(90,60,30,.35)}
.fx.tape{width:54px;height:18px;margin:-9px 0 0 -27px;background:var(--tp) center/cover;opacity:.88;transform:rotate(-6deg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.fx.tape.t2{background:rgba(214,196,228,.75) repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 4px,transparent 4px 9px)}
.fx.pclip{width:14px;height:36px;margin:-22px 0 0 -7px}
.fx.star{width:24px;height:24px;margin:-12px 0 0 -12px;filter:drop-shadow(1.5px 3px 2px rgba(40,25,10,.4))}
.fx.bean{width:13px;height:17px;margin:-8.5px 0 0 -6.5px;border-radius:50%;background:radial-gradient(ellipse at 35% 30%,#a8775a,#5b3622 60%,#3a2214);box-shadow:1.5px 3px 3px rgba(30,15,5,.45);transform:rotate(-25deg)}
.fx.bean::after{content:'';position:absolute;left:50%;top:2px;bottom:2px;width:1.6px;margin-left:-.8px;border-radius:2px;background:#2a170c;transform:rotate(8deg)}
.fx.clear{width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95) 0,rgba(255,255,255,.35) 30%,rgba(255,255,255,.12) 60%,rgba(255,255,255,.45) 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),1px 2px 2px rgba(40,25,10,.25)}
.fx.clip.cc{background:linear-gradient(90deg,color-mix(in srgb,var(--cc) 80%,#000),var(--cc) 45%,color-mix(in srgb,var(--cc) 85%,#fff) 60%,color-mix(in srgb,var(--cc) 75%,#000))}
.ph.f-pcard{background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.18) 40%,rgba(255,255,255,.4));padding:7% 7% 9%;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),inset 0 0 0 2px rgba(200,190,210,.3)}
.ph.f-pcard .pic{border-radius:6px;box-shadow:0 0 0 2px #fff}
.ph.f-pcard .cap{position:absolute;left:0;right:0;bottom:1%;font-size:10px;color:#6a5a72;padding:0}
.ph.f-pcard::before{content:'';position:absolute;left:50%;top:2.5%;width:22%;height:2.2%;margin-left:-11%;border-radius:3px;background:rgba(160,150,170,.25)}
.ph.f-pcard::after{content:'♡';position:absolute;right:-4%;top:-3%;width:26%;aspect-ratio:1;border-radius:50%;background:#f7c6d1;color:#fff;font:600 13px/1 system-ui;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.15);transform:rotate(12deg)}
.ph.f-booth{background:#fbf8f2;padding:8% 8% 2%}.ph.f-booth .pic{margin-bottom:6%}.ph.f-booth .cap{font-size:10px;padding:0 0 6%}
.fx.knot{width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#d8c6a4 40%,#8c7457);box-shadow:1px 2px 2px rgba(0,0,0,.35)}
.it .str{position:absolute;left:-.75px;top:0;width:1.5px;background:linear-gradient(90deg,#9c8463,#d6c29e,#9c8463);transform-origin:50% 0}
.pop .fx{animation:pinPress .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes pinPress{0%{transform:scale(1.6) translateY(-6px);opacity:.4}100%{transform:none;opacity:1}}
.lift .fx:not(.knot){opacity:0;transform:scale(1.5) translateY(-10px);transition:all .18s}
.lift .fx.tape{opacity:.0}

/* trash / drawer zone during drag */
#dropZone{position:absolute;left:50%;bottom:96px;transform:translate(-50%,40px);width:150px;height:54px;border-radius:27px;z-index:70;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;color:#7a6650;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.3,1.3,.5,1);box-shadow:0 8px 20px rgba(60,40,20,.18)}
#dropZone.show{opacity:1;transform:translate(-50%,0)}
#dropZone.hot{background:rgba(250,232,214,.95);transform:translate(-50%,0) scale(1.08);color:#8a5a3a}

/* fab */
#fab{position:absolute;right:20px;bottom:100px;z-index:55;width:52px;height:52px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 35% 28%,#fff,#f4eef7 60%,#e2d6ea);box-shadow:0 8px 20px rgba(80,50,100,.25),inset 0 -2px 4px rgba(120,90,140,.15);display:flex;align-items:center;justify-content:center}
#fab{background:none!important;box-shadow:none!important;width:60px!important;height:54px!important;right:16px!important;bottom:98px!important;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
#fab:active{transform:scale(.9) rotate(-4deg)}
#fab .cam{width:60px;height:54px;filter:drop-shadow(0 6px 10px rgba(60,35,80,.32))}
#fab .plus{position:absolute;right:-3px;top:-4px;width:21px;height:21px;border-radius:50%;background:#5d4a73;color:#fff;font:600 16px/20px system-ui;text-align:center;font-style:normal;box-shadow:0 2px 6px rgba(60,35,80,.35);border:2px solid #fff}
#hint{position:absolute;left:0;right:0;bottom:92px;text-align:center;font-size:11px;color:#a39aa8;z-index:40;pointer-events:none;transition:opacity .6s}

/* ---------- long-press menu ---------- */
#menu{position:absolute;z-index:120;display:flex;gap:2px;padding:4px;border-radius:14px;background:rgba(40,32,48,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.25);transform:scale(.6);opacity:0;pointer-events:none;transition:all .22s cubic-bezier(.3,1.4,.5,1);transform-origin:50% 100%}
#menu.show{transform:none;opacity:1;pointer-events:auto}
#menu div{color:#fff;font-size:12.5px;padding:8px 11px;border-radius:10px;white-space:nowrap;cursor:pointer}
#menu div:active{background:rgba(255,255,255,.15)}
#menu::after{content:'';position:absolute;left:var(--ax,50%);bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:rgba(40,32,48,.86)}

/* ---------- detail ---------- */
#detail{position:absolute;inset:0;z-index:100;pointer-events:none}
#detail .dim{position:absolute;inset:0;background:rgba(36,26,30,.45);backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);opacity:0;transition:opacity .45s,backdrop-filter .45s,-webkit-backdrop-filter .45s}
#detail.on{pointer-events:auto}
#detail.on .dim{opacity:1;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#stage{position:absolute;left:0;top:0;perspective:1400px;transform-origin:0 0}
#stage .flip{position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.45,.05,.2,1)}
#stage .flip.back{transform:rotateY(180deg)}
#stage .face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
#stage .bk{position:absolute;inset:0;transform:rotateY(180deg);background:#fbf7ee;border-radius:2px;box-shadow:6px 20px 30px rgba(30,15,5,.3);overflow:hidden;
  background-image:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,0)),repeating-linear-gradient(180deg,transparent 0 31px,rgba(150,130,170,.25) 31px 32px);background-position:0 58px}
#stage .bk::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 0,rgba(255,255,255,.6),transparent 60%),radial-gradient(90% 60% at 100% 100%,rgba(190,160,120,.18),transparent 70%);pointer-events:none}
.rec{position:absolute;inset:0;padding:22px 22px 18px;display:flex;flex-direction:column;color:#4c3f37}
.rec .ttl{font:clamp(22px,6.6vw,28px)/1.2 var(--hand);color:#4a3a52;min-height:34px;outline:none}
.rec .meta{display:flex;gap:10px;margin:6px 0 10px;font:13px/1.4 var(--serif);color:#8b7a8f;font-style:italic}
.rec .meta span{outline:none;border-bottom:1px dashed transparent;min-width:20px}
.rec .note{flex:1;font:clamp(16px,4.6vw,19px)/32px var(--hand);outline:none;overflow:auto;white-space:pre-wrap;margin-top:2px}
.rec [contenteditable]:focus{border-bottom-color:rgba(140,110,160,.5);background:rgba(200,180,220,.12);border-radius:3px}
.rec .stampMini{position:absolute;right:16px;top:14px;width:46px;transform:rotate(6deg);opacity:.92}
.rec .pm{position:absolute;right:46px;top:44px;width:64px;height:64px;opacity:.35;pointer-events:none}
#tools{position:absolute;left:0;right:0;bottom:104px;display:flex;justify-content:center;gap:10px;opacity:0;transform:translateY(20px);transition:all .4s cubic-bezier(.3,1.3,.5,1);z-index:2}
#detail.on #tools{opacity:1;transform:none}
#tools div{padding:10px 16px;border-radius:20px;background:rgba(255,255,255,.88);font-size:13px;color:#5a4a60;box-shadow:0 6px 16px rgba(0,0,0,.18);cursor:pointer;display:flex;align-items:center;gap:6px}
#tools div.pri{background:#5d4a73;color:#fff}
#dClose{position:absolute;right:18px;top:100px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s;z-index:3;cursor:pointer}
#detail.on #dClose{opacity:1}
.objTag{position:absolute;width:min(72vw,300px);left:50%;transform:translateX(-50%);background:#f3e9d6;border-radius:6px 6px 10px 10px;box-shadow:0 14px 30px rgba(30,15,5,.3);padding:18px 20px 16px;opacity:0;transition:opacity .4s .25s,transform .5s .2s cubic-bezier(.3,1.3,.5,1);
  background-image:radial-gradient(90% 60% at 10% 0,rgba(255,255,255,.55),transparent 60%),repeating-linear-gradient(180deg,transparent 0 29px,rgba(140,110,80,.18) 29px 30px);background-position:0 0,0 50px}
.objTag::before{content:'';position:absolute;left:50%;top:9px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#d9cbb2;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.objTag.show{opacity:1}
.objTag .rec{position:relative;inset:auto;padding:12px 0 0}
.objTag .note{font-size:17px;line-height:30px;max-height:150px}

/* ---------- sheet ---------- */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:130;transform:translateY(105%);transition:transform .45s cubic-bezier(.3,1.15,.4,1);background:#fbf8fb;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(50,30,60,.2);padding:10px 16px 28px;max-height:78%;display:flex;flex-direction:column}
#sheet.on{transform:none}
#sheetDim{position:absolute;inset:0;z-index:129;background:rgba(30,20,35,.3);opacity:0;pointer-events:none;transition:opacity .35s}
#sheetDim.on{opacity:1;pointer-events:auto}
#sheet .grab{width:38px;height:5px;border-radius:3px;background:#ddd5e2;margin:0 auto 10px}
.seg{display:flex;background:#efe9f1;border-radius:12px;padding:3px;margin-bottom:12px}
.seg div{flex:1;text-align:center;font-size:13px;padding:7px 0;border-radius:9px;color:#8a7e93;cursor:pointer}
.seg div.on{background:#fff;color:#4a3d58;box-shadow:0 1px 4px rgba(0,0,0,.08);font-weight:500}
.pane{overflow:auto;flex:1;min-height:0}
.lbl{font-size:12px;color:#9a8ea6;margin:12px 2px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:16px;background:#f0eaf2;font-size:12.5px;color:#5e5068;cursor:pointer;display:flex;align-items:center;gap:6px;border:1.5px solid transparent}
.chip.on{background:#fff;border-color:#9a83b8;color:#4a3d58}
.chip i{width:14px;height:14px;border-radius:4px;display:inline-block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.upl{display:flex;gap:10px;align-items:stretch}
.upl .btn{flex:1;border:1.5px dashed #c9b8d8;border-radius:14px;padding:14px 8px;text-align:center;font-size:13px;color:#7a6890;cursor:pointer;background:#fff}
.prev{height:170px;display:flex;align-items:center;justify-content:center;background:#9a6c45;border-radius:12px;margin-top:4px;position:relative;overflow:hidden}
.prev .it{position:absolute;left:50%;top:26px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid .g{aspect-ratio:1;border-radius:12px;background:#f2edf3;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;border:1.5px solid transparent}
.grid .g.on{border-color:#9a83b8;background:#fff}
.grid .g img{max-width:74%;max-height:74%;filter:drop-shadow(1px 2px 2px rgba(0,0,0,.18))}
.grid .g span{position:absolute;bottom:3px;font-size:9.5px;color:#9a8ea6}
.go{margin-top:14px;height:46px;border-radius:23px;background:#5d4a73;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;flex-shrink:0;letter-spacing:.06em}
.go.dis{opacity:.4;pointer-events:none}
.tin{flex:1;min-width:0;height:38px;border-radius:12px;border:1px solid #e4dbe8;padding:0 10px;font:13px var(--serif);color:#4a3d58;background:#fff;outline:none}
.grid .g .del{position:absolute;right:-5px;top:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#fff;color:#a0909f;font:600 13px/19px system-ui;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.15);cursor:pointer}
.grid .g .del.sure{background:#d4727c;color:#fff;font-size:10.5px}
.grid .g .nm{outline:none;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid .g .nm[contenteditable=true]{background:#fff;color:#4a3d58;border-radius:4px;padding:0 3px;box-shadow:0 0 0 1px #9a83b8;bottom:3px;z-index:2}
.seg div[contenteditable=true]{outline:none;background:#fff;box-shadow:0 0 0 1.5px #9a83b8 inset;color:#4a3d58}
.empty{font-size:13px;color:#a99eb2;text-align:center;padding:30px 0}

/* ---------- mailbox overlay ---------- */

#mail.on{opacity:1;pointer-events:auto}

<script>
const A=__ASSETS__;
const MAILBOX_B64="__MAILBOX__";
const $=s=>document.querySelector(s), app=$('#app'), board=$('#board'), itemsEl=$('#items');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
const KEY='maWall9';
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;app.appendChild(e);requestAnimationFrame(()=>e.classList.add('on'));setTimeout(()=>{e.classList.remove('on');setTimeout(()=>e.remove(),400)},1600)}

/* ================= felt texture ================= */
function drawFelt(){
  const c=$('#felt'),r=board.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);
  c.width=r.width*d;c.height=r.height*d;c.style.width=r.width+'px';c.style.height=r.height+'px';
  const g=c.getContext('2d');g.scale(d,d);const W=r.width,H=r.height;
  g.fillStyle='#9a6c45';g.fillRect(0,0,W,H);
  // mottling
  for(let i=0;i<60;i++){const x=Math.random()*W,y=Math.random()*H,rr=20+Math.random()*70;const gr=g.createRadialGradient(x,y,0,x,y,rr);
    const l=Math.random()<.5;gr.addColorStop(0,l?'rgba(196,148,100,.22)':'rgba(96,60,34,.22)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-rr,y-rr,rr*2,rr*2)}
  // fibres (batched by colour), then soften
  const n=Math.floor(W*H/3.2),cols=['rgba(222,182,138,.16)','rgba(214,170,124,.26)','rgba(84,50,26,.10)','rgba(84,50,26,.18)','rgba(240,214,180,.1)'],wt=[.24,.2,.24,.24,.08];
  cols.forEach((cl,ci)=>{g.strokeStyle=cl;g.lineWidth=ci%2?.45:.7;g.beginPath();const m=n*wt[ci];
    for(let i=0;i<m;i++){const x=Math.random()*W,y=Math.random()*H,a=Math.random()*6.283,l=1+Math.random()*3.2;g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+.6)*l*.6,y+Math.sin(a+.6)*l*.6,x+Math.cos(a)*l,y+Math.sin(a)*l)}g.stroke()});
  try{const t=document.createElement('canvas');t.width=c.width;t.height=c.height;const tg=t.getContext('2d');tg.filter='blur(.5px)';tg.drawImage(c,0,0);g.setTransform(1,0,0,1,0,0);g.globalAlpha=.75;g.drawImage(t,0,0);g.globalAlpha=1}catch(e){}
  // fine noise
  const id=g.getImageData(0,0,c.width,c.height),p=id.data;for(let i=0;i<p.length;i+=4){const v=(Math.random()-.5)*14;p[i]+=v;p[i+1]+=v;p[i+2]+=v}g.putImageData(id,0,0);
}

/* ================= garland ================= */
let BW=0,BH=0,SLOTS=[];
const SLOTDEF=[{u:.09,len:.08},{u:.23,len:.115},{u:.36,len:.065},{u:.5,len:.1},{u:.64,len:.06},{u:.78,len:.13},{u:.92,len:.075}];
let GW=0,GH=0,OX=0,OY=0;
function gPt(u){// swag between two hooks on the frame (wallWrap coords)
  const x0=OX-2,y0=4,x1=GW-OX+2,cx=GW/2,cy=OY+.13*BH,m=1-u;
  return {x:m*m*x0+2*m*u*cx+u*u*x1,y:m*m*y0+2*m*u*cy+u*u*y0}}
function tail(side,u){// bead tail hanging outside the frame
  const sx=side<0?OX-2:GW-OX+2,dir=side;const x=sx+dir*(Math.sin(u*2.2)*16),y=4+u*u*90+u*6;return {x,y}}
function drawGarland(){
  const s=$('#garland'),ww=$('#wallWrap').getBoundingClientRect(),br=board.getBoundingClientRect();
  GW=ww.width;GH=ww.height;OX=br.left-ww.left;OY=br.top-ww.top;
  s.setAttribute('viewBox',`0 0 ${GW} ${GH}`);let h=`<defs><radialGradient id="wb" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff8ea"/><stop offset=".35" stop-color="#ead7b4"/><stop offset="1" stop-color="#b8996f"/></radialGradient><linearGradient id="clipg"><stop offset="0" stop-color="#c9a77c"/><stop offset=".4" stop-color="#e9cfa6"/><stop offset=".6" stop-color="#d9b88b"/><stop offset="1" stop-color="#b8936a"/></linearGradient><filter id="sh" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="1.2" dy="2.5" stdDeviation="1.4" flood-color="#2a1a0c" flood-opacity=".38"/></filter></defs>`;
  SLOTS=SLOTDEF.map(d=>{const p=gPt(d.u);return {gx:p.x,gy:p.y,x:p.x-OX,y0:p.y-OY,y:p.y-OY+d.len*BH}});
  h+=`<g filter="url(#sh)">`;
  SLOTS.forEach((s,i)=>{h+=`<line x1="${s.gx}" y1="${s.gy}" x2="${s.gx}" y2="${s.y+OY}" stroke="#b49a72" stroke-width="1.3"/>`;
    const nb=2+(i%2);for(let k=0;k<nb;k++){h+=`<circle cx="${s.gx}" cy="${s.gy+9+k*7.2}" r="3.6" fill="url(#wb)"/>`}});
  const R=Math.max(5,BW*.0148);const bead=(p,big)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${(big?R:R*.55).toFixed(1)}" fill="${big?'url(#wb)':'#c9ad84'}"/>`;
  // tails
  [-1,1].forEach(sd=>{let u=0,k=0;while(u<=1){h+=bead(tail(sd,u),k%3!==2);u+=.075;k++}const e=tail(sd,1.02);
    h+=`<g transform="translate(${e.x},${e.y})"><path d="M-1 0 L-5 22 M0 0 L0 24 M1 0 L5 22 M-3 0 L-3 23 M3 0 L3 23" stroke="#d9c39c" stroke-width="1.2"/><circle r="4.5" fill="url(#wb)"/></g>`});
  let u=0,k=0;while(u<=1.001){h+=bead(gPt(u),k%3!==2);u+=k%3===1?.016:.022;k++}
  // hooks on frame corners
  [OX-2,GW-OX+2].forEach(x=>{h+=`<circle cx="${x}" cy="4" r="3.4" fill="#8e8a86"/><circle cx="${x-1}" cy="3" r="1.2" fill="#e8e4df"/>`});
  SLOTS.forEach((s,i)=>{if(!S.items.find(o=>o.slot===i&&!o.off))h+=`<g transform="translate(${s.gx-6.5},${s.y+OY-24})"><rect width="13" height="40" rx="3" fill="url(#clipg)"/><rect x="-1" y="14" width="15" height="5" rx="2" fill="#a7aaae"/><line x1="6.5" y1="0" x2="6.5" y2="40" stroke="rgba(90,60,30,.35)"/></g>`});
  h+='</g>';s.innerHTML=h;
}

   {id:id(),k:'paper',src:'tkP',w:.24,x:.12,y:0,slot:1,fx:'clip',r:-2,title:'伊丽莎白',sub:'MUSICAL',date:'2026.02.05',place:'上海文化广场',note:'第二排靠过道的位置。\n《我只属于我自己》那段，全场安静得能听见呼吸。散场后在门口买了一张海报。'},

   {id:id(),k:'photo',src:'g_snowwindow',frame:'pola',w:.13,x:0,y:0,slot:4,fx:'clip',r:3,title:'初雪',date:'2025.12.07',place:'家里的窗',note:'那年的第一场雪，是半夜从窗户里看到的。'},

   {id:id(),k:'photo',src:'g_pinkmoon',frame:'pink',w:.23,x:.52,y:.49,fx:'bean',r:-3,title:'粉月亮',date:'梦里',place:'不存在的海',note:'做过的一个梦：月亮是粉色的，海面上铺满了碎掉的光。\n醒来以后把它画了下来。'},

   {id:id(),k:'photo',src:'g_cafe',srcs:['g_cafe','g_sakura','g_snowwindow'],frame:'booth',w:.11,x:.965,y:.585,fx:'clip',cc:'#e9a5b8',r:4,title:'四季',date:'2025—2026',place:'',note:'一年里随手拍的三张，冬天的窗、春天的花、和每个周末的咖啡。'},

  // preview at scale
  const e=document.createElement('div');e.className='it '+(isCut(it)?'cut':'card');e.innerHTML='<div class="sw"><div class="bd"></div></div>';
  pv.appendChild(e);const w=Math.min(130,(tab==='obj'?90:140));const fakeW=w/it.w;BW=fakeW;BH=fakeW*1.55;
  e.firstChild.firstChild.innerHTML=bodyHTML(it);e.firstChild.insertAdjacentHTML('beforeend',fxHTML(it));
  const off=bodyOff(it),bd=e.firstChild.firstChild;bd.style.width=w+'px';bd.style.left=-w/2+(it.fx==='pclip'?w*.22:0)+'px';bd.style.top=off+'px';
  const s=e.querySelector('.str');if(it.fx==='string'){bd.style.top='34px';if(s)s.style.height='36px'}e.firstChild.style.transform='rotate(-3deg)';
  e.style.top=(it.fx==='string'?18:it.fx==='none'?70:26)+'px';BW=oBW;BH=oBH;
  if(it.fx==='string'){SW.__p=null}
  e.animate([{transform:'translateY(-8px)',opacity:.3},{transform:'none',opacity:1}],{duration:260,easing:'ease-out'})}
function commit(toBoxOnly){
  if(!draft.src)return;
  if(draft.fx==='star'&&!draft.sc)draft.sc=['#f6d86b','#9fc6ee','#b7dcc3','#f2b6c6'][Math.floor(Math.random()*4)];
  if(draft.fx==='pin'&&!draft.pc)draft.pc=PINC[Math.floor(Math.random()*PINC.length)];
  if(editing){const it=get(editing.id);Object.assign(it,draft);if(it.fx!=='clip')it.slot=null;mk(it);kick(it.id,25);save();closeSheet();return}
  const it={...draft,id:'u'+Date.now().toString(36),r:(Math.random()-.5)*8,note:draft.note||'',date:draft.date||today(),place:draft.place||''};
  if(tab==='paper'&&/^st/.test(it.src))it.w=.19;
  if(it.k==='photo'){const rr=it.frame==='pola'||it.frame==='strip'?1.3:clamp(ratioOf(it),.62,1.42)+.1;it.w=Math.min(it.w,.3*BH/(BW*rr))}
  if(it.k==='obj'&&it.src.startsWith('data:'))it.w=Math.min(.2,.16*BH/(BW*ratioOf(it)));
  if(it.k==='paper'&&it.src.startsWith('data:'))it.w=Math.min(.3,.2*BH/(BW*ratioOf(it)));
  S.items.push(it);
  if(tab==='photo'&&pending.length){pending.shift();pendingR.shift()}
  if(toBoxOnly===true){it.off=true;renderAll();save();toast('放进收纳盒了');if(tab==='photo'&&pending.length){draft.src=pending[0];draft.ratio=pendingR[0]}else resetDraft();renderPane();return}
  closeSheet();placeNew(it,false);
  if(tab==='photo'&&pending.length)setTimeout(()=>openSheet('photo'),900)}
function today(){const d=new Date();return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`}
function placeNew(it,fromBox){
  it.off=false;it.slot=null;it.z=++S.z;
  // find a free-ish spot
  let best=null,bs=-1;for(let k=0;k<60;k++){const x=.15+Math.random()*.7,y=.2+Math.random()*.62;let m=9;
    S.items.forEach(o=>{if(o===it||o.off)return;const a=o.slot!=null?{x:SLOTS[o.slot].x/BW,y:SLOTS[o.slot].y/BH}:o;m=Math.min(m,Math.hypot((a.x-x)*1,(a.y-y)*.7))});if(m>bs){bs=m;best={x,y}}}
  it.x=best.x;it.y=best.y;const e=mk(it);
  e.classList.add('lift');
  e.animate([{transform:`translate(${(.5-it.x)*BW}px,${BH*(1-it.y)+80}px) scale(1.25) rotate(8deg)`},{transform:'translateY(-14px) scale(1.06)',offset:.75},{transform:'none'}],{duration:760,easing:'cubic-bezier(.3,1,.4,1)'}).onfinish=()=>{
    e.classList.remove('lift');e.classList.add('pop');setTimeout(()=>e.classList.remove('pop'),450);kick(it.id,it.fx==='string'?90:30)};
  save();if(!fromBox)toast('挂好啦 · 轻点它可以写下这段回忆')}
// file upload
$('#file').onchange=async e=>{
  const fs=[...e.target.files];e.target.value='';if(!fs.length)return;
  const out=[];if(pickFor!=='paper')for(const f of fs.slice(0,9)){out.push(await shrink(f,pickFor==='obj'))}
  if(pickFor==='box'){pickFor=null;out.forEach((o,k)=>S.items.push({id:'u'+Date.now().toString(36)+k,k:'photo',src:o.u,ratio:o.r,frame:'pola',fx:'bead',w:.27,r:(Math.random()-.5)*8,title:'',note:'',date:today(),place:'',off:true}));save();renderAll();renderPane();toast(`放进收纳盒了 ${out.length} 张`);return}
  if(pickFor==='paper'){pickFor=null;const o=await shrink(fs[0],true);draft.k='paper';draft.src=o.u;draft.ratio=o.r;renderPane();return}
  if(pickFor==='obj'){pickFor=null;draft.src=out[0].u;draft.ratio=out[0].r;renderPane();return}
  if(pickFor){const it=pickFor;pickFor=null;it.src=out[0].u;it.ratio=out[0].r;if(it.frame==='none'||!it.frame)it.frame='pola';mk(it);save();
    if(cur===it){const fr=cur._fl.querySelector('.face');fr.innerHTML=bodyHTML(it)}toast('照片换好啦');return}
  pending=out.map(o=>o.u);pendingR=out.map(o=>o.r);draft.src=pending[0];draft.ratio=pendingR[0];renderPane()};
function shrink(f,alpha){return new Promise(res=>{const img=new Image();img.onload=()=>{const M=alpha?480:720,s=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);let u=alpha?c.toDataURL('image/webp',.86):c.toDataURL('image/jpeg',.82);if(alpha&&!u.startsWith('data:image/webp'))u=c.toDataURL('image/png');res({u,r:c.height/c.width})};img.src=URL.createObjectURL(f)})}

/* ================= boot ================= */
function sizeAll(){const r=board.getBoundingClientRect();BW=r.width;BH=r.height;drawFelt();drawGarland();S.items.forEach(layout)}
function boot(){sizeAll();renderAll();tabNames();
  const h=new Date().getHours();setLit(S.lit==null?(h>=18||h<6):S.lit);
  // entrance: items drop in staggered
  S.items.filter(i=>!i.off).sort((a,b)=>anchor(a).y-anchor(b).y).forEach((it,k)=>{const e=EL[it.id];
    e.animate([{opacity:0,transform:'translateY(-18px) scale(1.04)'},{opacity:1,transform:'none'}],{duration:520,delay:120+k*55,easing:'cubic-bezier(.3,1.3,.5,1)',fill:'backwards'});
    setTimeout(()=>kick(it.id,(it.fx==='string'?50:12)*(k%2?1:-1)),300+k*55)});
  if(!localStorage.getItem('maWallHint')){setTimeout(()=>toast('轻点查看 · 拖动换位置 · 长按更多'),1400);localStorage.setItem('maWallHint',1)}}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{sizeAll();S.items.forEach(mk)},150)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
boot();
</script>
